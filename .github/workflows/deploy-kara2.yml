# Deploy kara2 stack on push to main.
# Runs on a SELF-HOSTED runner on the LAN (kara2 LXC or PVE B).
# GitHub-hosted runners cannot reach 10.0.19.x.
#
# Setup: Documentation/GITHUB_ACTIONS_KARA2.md
name: Deploy kara2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kara2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, kara2]
    timeout-minutes: 30
    steps:
      - name: Sync repo and rebuild compose stack
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          REPO_DIR="${{ vars.KARA2_REPO_PATH || '/opt/kara2' }}"
          mkdir -p "$REPO_DIR"
          cd "$REPO_DIR"

          # Never persist PAT in git remote URL — use header auth for fetch only
          AUTH_HEADER=()
          if [ -n "${GH_PAT:-}" ]; then
            AUTH_HEADER=(-c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${GH_PAT}")
          fi

          if [ ! -d .git ]; then
            echo "Initializing git clone in $REPO_DIR"
            git "${AUTH_HEADER[@]}" clone https://github.com/aceplex2021/karaoke.git /tmp/kara2-clone
            cp -a /tmp/kara2-clone/. "$REPO_DIR/"
            rm -rf /tmp/kara2-clone
          fi

          # Normalize remote to token-free URL
          git remote set-url origin https://github.com/aceplex2021/karaoke.git
          git "${AUTH_HEADER[@]}" fetch origin main
          git reset --hard origin/main

          if [ ! -f .env ]; then
            echo "::error::Missing $REPO_DIR/.env — copy production env before deploying"
            exit 1
          fi
          if [ ! -f cloudflared/credentials.json ]; then
            echo "::error::Missing $REPO_DIR/cloudflared/credentials.json"
            exit 1
          fi
          chmod 644 cloudflared/credentials.json cloudflared/config.yml || true

          # Clear stale/conflicted web containers from interrupted recreates
          # (Docker can leave "No such container: <old-id>" deps that break compose up)
          docker compose stop web || true
          docker rm -f $(docker ps -aq --filter name=kara2-web) 2>/dev/null || true
          docker container prune -f >/dev/null 2>&1 || true

          docker compose up -d --build --remove-orphans --force-recreate
          docker compose ps
          echo "Deployed $(git rev-parse --short HEAD) to kara2"
